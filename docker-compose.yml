version: "3.8"

services:

  postgres:
    image: postgres:16
    container_name: incident-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: incidentdb
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: StrongPasswordHere
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - glpi_default

  incident-api:
    image: python:3.11-slim
    container_name: incident-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./app:/app
    command: bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_ZABBIX_CHANNEL_ID: ${SLACK_ZABBIX_CHANNEL_ID}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      LINE_TARGET_ID: ${LINE_TARGET_ID}
      LINE_ENABLED: ${LINE_ENABLED:-false}
      ZABBIX_WEBHOOK_TOKEN: ${ZABBIX_WEBHOOK_TOKEN}
      ROO_JAENG_BASE_URL: ${ROO_JAENG_BASE_URL:-https://roo-jaeng.com}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-true}
    depends_on:
      - postgres
    networks:
      - glpi_default

  incident-web-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incident-web-frontend
    restart: always
    networks:
      - glpi_default
    depends_on:
      - incident-api

networks:
  glpi_default:
    external: true
